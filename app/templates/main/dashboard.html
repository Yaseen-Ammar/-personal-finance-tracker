{% extends "app_base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <h1 class="page-title">Hello, {{ current_user.display_name }}</h1>
    <p class="page-sub">Your overview, charts and analytics arrive in the next phase.</p>
  </div>
</div>
<div class="d-flex flex-wrap gap-2">
  <a class="btn btn-brand" href="{{ url_for('transactions.new', type='expense') }}">Add expense</a>
  <a class="btn btn-outline-secondary" href="{{ url_for('transactions.new', type='income') }}">Add income</a>

</div>
{% endblock %}
